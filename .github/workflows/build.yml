name: Build

on: 
  push:
    branches:
      - main

env:
  TOOLCHAIN_SHA256: 97dbb4f019ad1650b732faffcc881689cedc14e2b7ee863d390e0a41ef16c9a3
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize submodules
      run: |
        git submodule update --init
    - name: Install gcc-arm-none-eabi-10.3
      run: |
        wget -q "https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2"
        echo "$TOOLCHAIN_SHA256  gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2" | sha256sum -c -
        sudo tar -xf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C /opt
        echo '/opt/gcc-arm-none-eabi-10.3-2021.10/bin' >> $GITHUB_PATH
    - name: Install packages build sbtools required
      run: |
        sudo apt-get update
        sudo apt-get install libcrypto++-dev libusb-1.0-0-dev -y
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: sbtools-cache
      with:
        path: tools/sbtools
        key: ${{ runner.os }}-${{ hashFiles('tools/sbtools/*') }}
    - name: Build sbtools
      if: steps.sbtools-cache.outputs.cache-hit != 'true'
      run: |
        cd tools/sbtools
        make
        cd ../..
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: sys_signer-cache
      with:
        path: |
          tools/sys_signer
          tools/sysigner
        key: ${{ runner.os }}-${{ hashFiles('tools/sys_signer/**/*') }}
    - name: Build sys signer
      if: steps.sys_signer-cache.outputs.cache-hit != 'true'
      run: |
        cd tools/sys_signer
        cmake .
        cmake --build .
        cp sysigner ../
        cd ../..
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: mpy-cache
      with:
        path: Libs/src/micropython-master/ports/eoslib
        key: ${{ runner.os }}-${{ hashFiles('Libs/src/micropython-master/ports/eoslib/**/*') }}
    - name: Build micropython
      if: steps.mpy-cache.outputs.cache-hit != 'true'
      run: |
        cd Libs/src/micropython-master/ports/eoslib
        make
        cd ../../../../..
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: khicas-cache
      with:
        path: |
          Libs/libcas.libcpp
          Libs/libcasgui.libcpp
        key: ${{ runner.os }}-${{ hashFiles('Libs/src/khicas/*') }}
    - name: Build KhiCAS
      if: steps.khicas-cache.outputs.cache-hit != 'true'
      run: |
        cd Libs/src/khicas/
        make clean
        make
        cd ../../..
    - name: CMake configure
      run: |
        echo "#pragma once" >  System/graphics/UI_build_stamp.h
        echo "#define BUILD_STAMP \"Release build ${{ github.run_number }}\"" >> System/graphics/UI_build_stamp.h
        mkdir build
        cmake -S . -B build
    - name : CMake build
      run: |
        cmake --build build
    - name: Generate checksums
      if: github.ref_name == 'main'
      run: |
        (cd build && sha256sum System/ExistOS.sys OSLoader/OSLoader.sb System/sys_symtab.txt > checksums.txt)
    - name: Create GitHub release
      if: github.ref_name == 'main'
      uses: marvinpinto/action-automatic-releases@919008c # v1.2.1 (repo archived, pin SHA)
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag:  build-${{ github.run_number }}
        title: build ${{ github.run_number }}
        prerelease: false
        files: |
          build/System/ExistOS.sys
          build/OSLoader/OSLoader.sb
          build/System/sys_symtab.txt
          build/checksums.txt
    - name: Upload Build outputs
      if: github.ref_name != 'main'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Build-outputs
        path: |
          build/System/ExistOS.sys
          build/OSLoader/OSLoader.sb
          build/System/sys_symtab.txt
          build/checksums.txt
